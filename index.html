<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Open Graph / Social preview (WhatsApp, Telegram, Viber, Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VOICE CLUB KARAOKE">
  <meta property="og:title" content="VOICE CLUB KARAOKE — Meniu & Bar">
  <meta property="og:description" content="Descoperă meniul nostru de cocktailuri, băuturi și karaoke! / Барное и караоке меню Voice Club.">
  <meta property="og:url" content="https://menu.voiceclub.top/">
  <meta property="og:image" content="https://menu.voiceclub.top/assets/images/menu-thumb.jpg">
  <meta property="og:image:secure_url" content="https://menu.voiceclub.top/assets/images/menu-thumb.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="400">
  <meta property="og:image:height" content="462">
  <meta property="og:image:alt" content="VOICE CLUB KARAOKE MENU">
  <meta property="og:locale" content="ro_MD">
  <meta property="og:locale:alternate" content="ru_RU">
  <meta property="og:locale:alternate" content="en_US">
  <!-- Twitter / Telegram large-image fallbacks -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="VOICE CLUB KARAOKE — Meniu & Bar">
  <meta name="twitter:description" content="Descoperă meniul nostru de cocktailuri, băuturi și karaoke! / Барное и караоке меню Voice Club.">
  <meta name="twitter:image" content="https://menu.voiceclub.top/assets/images/menu-thumb.jpg">
  <meta name="twitter:image:alt" content="VOICE CLUB KARAOKE MENU">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Bar Menu - Scan QR to view food and drinks">
  <title>MENU VOICE CLUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1a1a2e',
            secondary: '#16213e',
            accent: '#e94560',
            gold: '#ffd700'
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Montserrat (gold/neon/glass) + Cinzel (editorial) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-primary text-white min-h-screen font-sans antialiased">
  <!-- Sticky Header / Navigation - Hidden initially, shows on scroll -->
  <header id="main-header" class="fixed top-0 left-0 right-0 z-40 bg-primary/95 backdrop-blur-sm border-b border-white/10 transform -translate-y-full transition-transform duration-300 ease-out" role="banner" aria-hidden="true">
    <div class="flex items-center justify-center px-4 py-2.5">
      <!-- Navigation Buttons - <768px: scrolls horizontally inside the nav, scrollbar hidden -->
      <nav id="horizontal-nav" class="flex items-center gap-1 justify-center w-full overflow-x-auto md:overflow-x-visible [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" role="navigation" aria-label="Main menu">
        <!-- Dynamically rendered from config -->
      </nav>
    </div>
  </header>

  <!-- Hero Landing Section - Vertical Nav on food-page-1 -->
  <section id="hero-landing" class="relative min-h-screen flex items-center justify-center" aria-label="Main navigation">
    <!-- Background Image (first food page) -->
    <div id="hero-bg" class="absolute inset-0 z-0" aria-hidden="true"></div>
    <!-- Dark Overlay -->
    <div class="absolute inset-0 z-10 bg-gradient-to-b from-primary/70 via-primary/80 to-primary/95"></div>
    
    <!-- Vertical Navigation Buttons -->
    <div class="relative z-20 px-6 py-12 w-full max-w-md">
      <!-- Hero MENU Title - rendered from config, can be disabled in the admin panel -->
      <div id="hero-title-container" class="text-center"></div>
      <nav id="vertical-nav" class="space-y-3" role="navigation" aria-label="Main menu">
        <!-- Dynamically rendered from config -->
      </nav>
      
      <!-- Language Switcher in Hero -->
      <div class="mt-8 flex items-center gap-3 justify-center" role="group" aria-label="Language selection">
        <button class="hero-lang-btn px-6 py-3 text-base font-medium rounded-full bg-white/10 text-white/80 hover:bg-white/20 transition-colors whitespace-nowrap" data-lang="ro" aria-label="Romanian">RO</button>
        <button class="hero-lang-btn px-6 py-3 text-base font-medium rounded-full bg-white/10 text-white/80 hover:bg-white/20 transition-colors whitespace-nowrap" data-lang="ru" aria-label="Russian">RU</button>
        <button class="hero-lang-btn px-6 py-3 text-base font-medium rounded-full bg-white/10 text-white/80 hover:bg-white/20 transition-colors whitespace-nowrap" data-lang="en" aria-label="English">EN</button>
      </div>
      
      <!-- Scroll Indicator -->
      <div class="mt-10 flex justify-center">
        <button class="scroll-indicator w-auto px-6 py-3 text-center" data-nav="food" aria-label="Scroll to menu">
          <svg class="w-6 h-6 mx-auto text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main id="main-content" class="pt-4 pb-20" role="main">
    <!-- Main Menu Container - Image Based -->
    <div id="main-menu-container">
      <!-- Sections dynamically rendered from config -->
    </div>
  </main>

  <!-- PROMO SET Modal - Full screen (100vw x 100dvh) with horizontal swipe slider -->
  <div id="promo-modal" class="modal-fullscreen fixed inset-0 z-50 w-screen h-[100dvh] m-0 max-w-none rounded-none flex flex-col overflow-hidden hidden" role="dialog" aria-modal="true" aria-labelledby="promo-title">
    <!-- Modal Header - always visible, pinned to the top -->
    <div class="modal-header shrink-0 sticky top-0 z-30 bg-primary/95 border-b border-white/10 px-4 py-3">
      <button id="promo-back" class="back-btn w-full flex items-center justify-center gap-2 px-4 py-3 text-left bg-white/5 hover:bg-white/10 rounded-lg transition-colors" aria-label="Back to menu">
        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        <span class="font-medium" data-i18n="common.back">BACK</span>
      </button>
    </div>

    <!-- Modal Content - horizontal swipe slider (filled from config) -->
    <div class="modal-body flex-1 relative min-h-0 flex items-center justify-center">
      <h2 id="promo-title" class="sr-only" data-i18n="promo.title">PROMO SET</h2>
      <!-- Prev / Next arrows: thin chevrons, revealed only as a swipe hint -->
      <button type="button" class="modal-nav-btn modal-nav-prev" data-slider-arrows="promo" aria-label="Previous slide">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <button type="button" class="modal-nav-btn modal-nav-next" data-slider-arrows="promo" aria-label="Next slide">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
      <div id="promo-content" class="modal-slider">
        <!-- Dynamically rendered from config -->
      </div>
      <!-- Edge tap zones: invisible >=44px strips that switch slides when the
           guest taps the rim of the screen, even while the chevron is hidden -->
      <button type="button" class="modal-edge-zone modal-edge-zone-prev" data-slider-edge="promo" data-edge-dir="prev" tabindex="-1" aria-label="Previous slide"></button>
      <button type="button" class="modal-edge-zone modal-edge-zone-next" data-slider-edge="promo" data-edge-dir="next" tabindex="-1" aria-label="Next slide"></button>
      <!-- Bottom indicators: dots + counter -->
      <div class="modal-indicators" data-slider-dots="promo">
        <div class="modal-dots" data-slider-dots-list="promo"></div>
        <span class="modal-counter" data-slider-counter="promo">1 / 1</span>
      </div>
    </div>
  </div>

  <!-- BIRTHDAY OFFER Modal - Full screen (100vw x 100dvh) with horizontal swipe slider -->
  <div id="birthday-modal" class="modal-fullscreen fixed inset-0 z-50 w-screen h-[100dvh] m-0 max-w-none rounded-none flex flex-col overflow-hidden hidden" role="dialog" aria-modal="true" aria-labelledby="birthday-title">
    <!-- Modal Header - always visible, pinned to the top -->
    <div class="modal-header shrink-0 sticky top-0 z-30 bg-primary/95 border-b border-white/10 px-4 py-3">
      <button id="birthday-back" class="back-btn w-full flex items-center justify-center gap-2 px-4 py-3 text-left bg-white/5 hover:bg-white/10 rounded-lg transition-colors" aria-label="Back to menu">
        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        <span class="font-medium" data-i18n="common.back">BACK</span>
      </button>
    </div>

    <!-- Modal Content - horizontal swipe slider (filled from config) -->
    <div class="modal-body flex-1 relative min-h-0 flex items-center justify-center">
      <h2 id="birthday-title" class="sr-only" data-i18n="birthday.title">BIRTHDAY OFFER</h2>
      <!-- Prev / Next arrows: thin chevrons, revealed only as a swipe hint -->
      <button type="button" class="modal-nav-btn modal-nav-prev" data-slider-arrows="birthday" aria-label="Previous slide">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <button type="button" class="modal-nav-btn modal-nav-next" data-slider-arrows="birthday" aria-label="Next slide">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
      <div id="birthday-content" class="modal-slider">
        <!-- Dynamically rendered from config -->
      </div>
      <!-- Edge tap zones: invisible >=44px strips that switch slides when the
           guest taps the rim of the screen, even while the chevron is hidden -->
      <button type="button" class="modal-edge-zone modal-edge-zone-prev" data-slider-edge="birthday" data-edge-dir="prev" tabindex="-1" aria-label="Previous slide"></button>
      <button type="button" class="modal-edge-zone modal-edge-zone-next" data-slider-edge="birthday" data-edge-dir="next" tabindex="-1" aria-label="Next slide"></button>
      <!-- Bottom indicators: dots + counter -->
      <div class="modal-indicators" data-slider-dots="birthday">
        <div class="modal-dots" data-slider-dots-list="birthday"></div>
        <span class="modal-counter" data-slider-counter="birthday">1 / 1</span>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    // API base URL for development (wrangler pages dev on port 8787)
    // In production, this will be empty (relative URLs)
    window.MENU_API_BASE = window.location.port === '8080' ? 'http://127.0.0.1:8787' : '';
  </script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
