<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Bar Menu - Scan QR to view food and drinks">
  <title>MENU VOICE CLUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1a1a2e',
            secondary: '#16213e',
            accent: '#e94560',
            gold: '#ffd700'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-primary text-white min-h-screen font-sans antialiased">
  <!-- Sticky Header / Navigation - Hidden initially, shows on scroll -->
  <header id="main-header" class="fixed top-0 left-0 right-0 z-40 bg-primary/95 backdrop-blur-sm border-b border-white/10 transform -translate-y-full transition-transform duration-300 ease-out" role="banner" aria-hidden="true">
    <div class="flex items-center justify-center px-4 py-2.5">
      <!-- Navigation Buttons - No horizontal scroll, all fit -->
      <nav class="flex items-center gap-1 justify-center w-full" role="navigation" aria-label="Main menu">
        <button class="nav-btn flex-1 px-3 py-2 text-sm font-medium text-white/80 hover:text-white active:text-accent transition-colors whitespace-nowrap text-center" data-nav="food" data-i18n="nav.food">FOOD</button>
        <button class="nav-btn flex-1 px-3 py-2 text-sm font-medium text-white/80 hover:text-white active:text-accent transition-colors whitespace-nowrap text-center" data-nav="drinks" data-i18n="nav.drinks">DRINKS</button>
        <button class="nav-btn flex-1 px-3 py-2 text-sm font-medium whitespace-nowrap text-center text-transparent bg-clip-text bg-gradient-to-r from-accent via-red-500 to-orange-500" data-nav="promo" data-i18n="nav.promo">PROMO SET</button>
        <button class="nav-btn flex-1 px-3 py-2 text-sm font-medium text-white/80 hover:text-white active:text-accent transition-colors whitespace-nowrap text-center" data-nav="birthday" data-i18n="nav.birthday">BIRTHDAY OFFER</button>
      </nav>
    </div>
  </header>

  <!-- Hero Landing Section - Vertical Nav on food-page-1 -->
  <section id="hero-landing" class="relative min-h-screen flex items-center justify-center" aria-label="Main navigation">
    <!-- Background Image -->
    <div class="absolute inset-0 z-0" style="background-image: url('/assets/images/menu/food-page-1.jpg');" aria-hidden="true"></div>
    <!-- Dark Overlay -->
    <div class="absolute inset-0 z-10 bg-gradient-to-b from-primary/70 via-primary/80 to-primary/95"></div>
    
<!-- Vertical Navigation Buttons -->
    <div class="relative z-20 px-6 py-12 w-full max-w-md">
      <nav class="space-y-3" role="navigation" aria-label="Main menu">
        <button class="hero-nav-btn w-full py-6 px-6 text-center text-lg font-semibold text-white hover:text-accent transition-colors rounded-lg bg-white/5 backdrop-blur-sm border border-white/10 active:bg-white/10" data-nav="food">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v8c0 1.1.9 2 2 2h3Zm0 0v5"/></svg>
          <span data-i18n="nav.food">FOOD</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 8px;"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v8c0 1.1.9 2 2 2h3Zm0 0v5"/></svg>
        </button>
        <button class="hero-nav-btn w-full py-6 px-6 text-center text-lg font-semibold text-white hover:text-accent transition-colors rounded-lg bg-white/5 backdrop-blur-sm border border-white/10 active:bg-white/10" data-nav="drinks">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M8 22h8"/><path d="M12 11v11"/><path d="m19 3-7 8-7-8Z"/></svg>
          <span data-i18n="nav.drinks">DRINKS</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 8px;"><path d="M8 22h8"/><path d="M12 11v11"/><path d="m19 3-7 8-7-8Z"/></svg>
        </button>
        <button class="hero-nav-btn w-full py-6 px-6 text-center text-lg font-semibold transition-colors rounded-lg bg-white/5 backdrop-blur-sm border border-white/10 active:bg-white/10" data-nav="promo">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <span class="promo-text text-transparent bg-clip-text bg-gradient-to-r from-accent via-red-500 to-orange-500" data-i18n="nav.promo">PROMO SET</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 8px;"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        </button>
        <button class="hero-nav-btn w-full py-6 px-6 text-center text-lg font-semibold text-white hover:text-accent transition-colors rounded-lg bg-white/5 backdrop-blur-sm border border-white/10 active:bg-white/10" data-nav="birthday">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16h16"/><path d="M12 11V7"/><path d="M8 11V8"/><path d="M16 11V8"/><path d="M12 4v.01"/><path d="M8 5v.01"/><path d="M16 5v.01"/></svg>
          <span data-i18n="nav.birthday">BIRTHDAY OFFER</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 8px;"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16h16"/><path d="M12 11V7"/><path d="M8 11V8"/><path d="M16 11V8"/><path d="M12 4v.01"/><path d="M8 5v.01"/><path d="M16 5v.01"/></svg>
        </button>
      </nav>
      
      <!-- Language Switcher in Hero -->
      <div class="mt-8 flex items-center gap-3 justify-center" role="group" aria-label="Language selection">
        <button class="hero-lang-btn px-6 py-3 text-base font-medium rounded-full bg-white/10 text-white/80 hover:bg-white/20 transition-colors whitespace-nowrap" data-lang="ro" aria-label="Romanian">RO</button>
        <button class="hero-lang-btn px-6 py-3 text-base font-medium rounded-full bg-white/10 text-white/80 hover:bg-white/20 transition-colors whitespace-nowrap" data-lang="ru" aria-label="Russian">RU</button>
        <button class="hero-lang-btn px-6 py-3 text-base font-medium rounded-full bg-white/10 text-white/80 hover:bg-white/20 transition-colors whitespace-nowrap" data-lang="en" aria-label="English">EN</button>
      </div>
      
      <!-- Scroll Indicator -->
      <div class="mt-10 flex justify-center">
        <button class="scroll-indicator w-auto px-6 py-3 text-center" data-nav="food" aria-label="Scroll to menu">
          <svg class="w-6 h-6 mx-auto text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main id="main-content" class="pt-4 pb-20" role="main">
    <!-- Main Menu Container - Image Based -->
    <div id="main-menu-container">
      
      <!-- FOOD Section -->
      <section id="food-section" class="menu-section px-4" aria-labelledby="food-title">
        <h2 id="food-title" class="sr-only" data-i18n="sections.food">FOOD MENU</h2>
        
        <!-- Placeholder images - replace with actual JPG files -->
        <div class="space-y-4">
          <img src="/assets/images/menu/food-page-2.jpg" alt="Food Menu Page 2" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/food-page-3.jpg" alt="Food Menu Page 3" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/food-page-4.jpg" alt="Food Menu Page 4" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/food-page-5.jpg" alt="Food Menu Page 5" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
        </div>
      </section>

      <!-- DRINKS Section -->
      <section id="drinks-section" class="menu-section px-4" aria-labelledby="drinks-title">
        <h2 id="drinks-title" class="sr-only" data-i18n="sections.drinks">DRINKS MENU</h2>
        
        <!-- Placeholder images - replace with actual JPG files -->
        <div class="space-y-4">
          <img src="/assets/images/menu/drinks-page-1.jpg" alt="Drinks Menu Page 1" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-2.jpg" alt="Drinks Menu Page 2" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-3.jpg" alt="Drinks Menu Page 3" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-4.jpg" alt="Drinks Menu Page 4" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-5.jpg" alt="Drinks Menu Page 5" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-6.jpg" alt="Drinks Menu Page 6" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-7.jpg" alt="Drinks Menu Page 7" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-8.jpg" alt="Drinks Menu Page 8" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-9.jpg" alt="Drinks Menu Page 9" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-10.jpg" alt="Drinks Menu Page 10" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/drinks-page-11.jpg" alt="Drinks Menu Page 11" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
        </div>
      </section>
    </div>
  </main>

  <!-- PROMO SET Modal -->
  <div id="promo-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="promo-title">
    <div class="min-h-screen">
      <!-- Sticky Back Button -->
      <div class="sticky top-0 z-10 bg-primary/95 backdrop-blur-sm border-b border-white/10 px-4 py-3">
        <button id="promo-back" class="back-btn w-full flex items-center justify-center gap-2 px-4 py-3 text-left bg-white/5 hover:bg-white/10 rounded-lg transition-colors" aria-label="Back to menu">
          <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="font-medium" data-i18n="common.back">BACK</span>
        </button>
      </div>

      <!-- Modal Content - Image Based -->
      <div class="px-4 py-6">
        <h2 id="promo-title" class="sr-only" data-i18n="promo.title">PROMO SET</h2>
        <div id="promo-content" class="space-y-4">
          <img src="/assets/images/menu/promo-page-1.jpg" alt="Promo Set Page 1" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/promo-page-2.jpg" alt="Promo Set Page 2" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
        </div>
      </div>
    </div>
  </div>

  <!-- BIRTHDAY OFFER Modal -->
  <div id="birthday-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="birthday-title">
    <div class="min-h-screen">
      <!-- Sticky Back Button -->
      <div class="sticky top-0 z-10 bg-primary/95 backdrop-blur-sm border-b border-white/10 px-4 py-3">
        <button id="birthday-back" class="back-btn w-full flex items-center justify-center gap-2 px-4 py-3 text-left bg-white/5 hover:bg-white/10 rounded-lg transition-colors" aria-label="Back to menu">
          <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="font-medium" data-i18n="common.back">BACK</span>
        </button>
      </div>

      <!-- Modal Content - Image Based -->
      <div class="px-4 py-6">
        <h2 id="birthday-title" class="sr-only" data-i18n="birthday.title">BIRTHDAY OFFER</h2>
        <div id="birthday-content" class="space-y-4">
          <img src="/assets/images/menu/birthday-page-1.jpg" alt="Birthday Offer Page 1" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
          <img src="/assets/images/menu/birthday-page-2.jpg" alt="Birthday Offer Page 2" class="w-full h-auto rounded-lg shadow-lg" loading="lazy">
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
